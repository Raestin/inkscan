name: Original no-image placeholder validation (no deploy step)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-qa:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/promo-art-20261025-63d4b7'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .github/qa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Verify production preservation and construct isolated copy
        run: |
          node verify-release.cjs
          node prepare-fixture.cjs
      - name: Install pinned tests
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax and unit/contract tests
        id: unit
        run: |
          set -o pipefail
          mkdir -p unit-results
          npm run check
          npm run test:unit | tee unit-results/unit-tests.txt
      - name: Disposable PostgreSQL and PostgREST compatibility
        run: |
          set -o pipefail
          bash database/run-integration.sh | tee unit-results/database-compatibility.txt
      - name: Install official Chromium and dependencies
        id: browser-deps
        if: ${{ !cancelled() && steps.unit.conclusion == 'success' }}
        run: npx --no-install playwright install --with-deps chromium
      - name: Desktop and mobile isolated release UI
        if: ${{ !cancelled() && steps.browser-deps.conclusion == 'success' }}
        run: npm run test:browser
      - name: Keep synthetic evidence for 7 days
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-qa-${{ github.event.pull_request.head.sha }}
          path: |
            .github/qa/playwright-report/
            .github/qa/test-results/
            .github/qa/unit-results/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
