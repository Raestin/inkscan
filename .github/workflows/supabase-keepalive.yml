name: Keep Supabase awake

# Free Supabase projects pause after 7 days without activity.
# This calls public.keepalive() every 3 days so InkScan's cloud Update keeps
# working. The function returns true and reads no data; it uses the public
# (publishable) key the app already ships.

on:
  schedule:
    - cron: '17 15 */3 * *'   # every 3 days, 15:17 UTC (about 10 AM Central)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Call the keepalive function
        run: |
          code=$(curl -sS -o /tmp/body.json -w '%{http_code}' -X POST \
            -H 'apikey: sb_publishable_biFosNnFXZK8xSUiJOk0xw_wLrKGrD6' \
            -H 'Content-Type: application/json' -d '{}' \
            'https://fzavmefambwdhnzmbvxv.supabase.co/rest/v1/rpc/keepalive')
          echo "HTTP $code: $(cat /tmp/body.json)"
          test "$code" = "200"
