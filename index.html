<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D1A35">
<title>InkScan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Sticky header with totals and tabs; Scan tab is a live viewfinder with a card-shaped guide, then the recent-scan log. */
:root{
  --bg:#F2F1F6; --surface:#FFFFFF; --sunk:#E7E5EF; --fg:#1D1A35; --muted:#625E7A; --line:#D8D5E3;
  --accent:#9A6B12; --accent-fg:#FFFFFF; --accent-soft:#F4E8CF; --gold:#E3B04F;
  --ok:#2E7D4F; --warn:#A65E00; --bad:#B3261E;
  --amber:#E0A21B; --amethyst:#7B3FA0; --emerald:#2E8B57; --ruby:#C0263C; --sapphire:#1F6FB5; --steel:#7D8A96;
  --display:"Marcellus","Palatino Linotype",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#13111F; --surface:#1D1A2E; --sunk:#262338; --fg:#ECEAF6; --muted:#A39FBE; --line:#34304B;
  --accent:#E3B04F; --accent-fg:#1A1406; --accent-soft:#3A2F17;
  --ok:#6CC995; --warn:#F0A64A; --bad:#FF8A80; color-scheme:dark;}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 calc(40px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:400;font-size:26px;margin:0;letter-spacing:.02em}
.brand h1 b{color:var(--accent);font-weight:400}
.totals{display:flex;gap:14px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.totals strong{color:var(--fg);font-weight:700;font-size:15px}
.tabs{display:flex;gap:4px;margin-top:10px}
.tab{flex:1;background:none;border:0;padding:10px 0 11px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.note{font-size:13px;color:var(--muted)}
.tiny{font-size:12px}
.banner{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:13px;color:var(--muted)}
.banner.bad{color:var(--bad)}
section.panel{padding-top:14px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.h2{font-family:var(--display);font-weight:400;font-size:19px;margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,.item-main:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search],select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* viewfinder */
.cam{position:relative;width:100%;aspect-ratio:3/4;max-height:62vh;background:#0B0A12;border-radius:14px;overflow:hidden}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:84%;aspect-ratio:63/88;max-width:86%;border:2px solid rgba(255,255,255,.75);border-radius:4%;box-shadow:0 0 0 999px rgba(8,6,16,.45);pointer-events:none;transition:border-color .15s}
.guide.hit{border-color:var(--gold)}
.strip{position:absolute;left:0;bottom:0;width:66%;height:11%;border:2px dashed var(--gold);border-radius:0 6px 0 6px;background:rgba(227,176,79,.12)}
.camstate{position:absolute;left:10px;top:10px;right:120px;padding:7px 10px;color:#fff;font-size:13px;line-height:1.3;background:rgba(0,0,0,.6);border-radius:9px}
.camstart{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:#E9E6F5;text-align:center;padding:20px}
.camstart .btn{font-size:16px;padding:12px 20px}
.camtools{position:absolute;top:10px;right:10px;display:flex;gap:8px}
.camtools button{background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer}
.camtools button[aria-pressed="true"]{background:var(--gold);color:#1A1406;border-color:var(--gold)}
.flash{position:absolute;inset:0;background:var(--gold);opacity:0;pointer-events:none}
.flash.go{animation:fl .35s ease-out}
@keyframes fl{from{opacity:.35}to{opacity:0}}
@media (prefers-reduced-motion:reduce){.flash.go{animation:none}}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-main{display:flex;gap:10px;align-items:center;padding:10px 12px;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.ink{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.ink.Amber{background:var(--amber)}.ink.Amethyst{background:var(--amethyst)}.ink.Emerald{background:var(--emerald)}
.ink.Ruby{background:var(--ruby)}.ink.Sapphire{background:var(--sapphire)}.ink.Steel{background:var(--steel)}
.ink.dual{background:conic-gradient(var(--c1) 0 50%,var(--c2) 50% 100%)}
.who{flex:1;min-width:0}
.who .n{font-weight:600;overflow-wrap:anywhere}
.who .v{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.who .m{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--sunk);color:var(--muted);vertical-align:1px}
.chip.foil{background:var(--accent-soft);color:var(--accent)}
.qtyv{text-align:right;font-variant-numeric:tabular-nums;flex:none}
.qtyv .q{font-weight:700}
.qtyv .p{font-size:12px;color:var(--muted)}
.edit{padding:4px 12px 12px 32px;display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step label{min-width:62px;font-size:13px;color:var(--muted)}
.step button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);font-size:18px;font-weight:700;cursor:pointer}
.step button:disabled{opacity:.4}
.step output{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.edit a{color:var(--accent);font-weight:600;font-size:13px}
.group{padding:12px 12px 6px;font-family:var(--display);font-size:15px;background:var(--sunk);display:flex;justify-content:space-between;gap:8px}
.group span{font-family:var(--body);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:24px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--display);font-weight:400;font-size:19px;margin-bottom:6px}
.res{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer}
.res:first-child{border-top:0}
.log-act{display:flex;gap:6px;align-items:center;flex:none}
.log-act button{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700;cursor:pointer}
.log-act button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Ink<b>Scan</b></h1>
      <div class="totals" aria-live="polite">
        <span><strong id="tUnique">0</strong> cards</span>
        <span><strong id="tCopies">0</strong> copies</span>
        <span><strong id="tValue">$0</strong></span>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabScan" aria-selected="true">Scan</button>
      <button class="tab" role="tab" id="tabColl" aria-selected="false">Collection</button>
    </nav>
  </header>

  <div id="loadBanner" class="banner">Loading the card list…</div>

  <!-- SCAN -->
  <section class="panel" id="pScan">
    <div class="cam" id="cam">
      <video id="video" playsinline muted></video>
      <div class="guide" id="guide" hidden><div class="strip"></div></div>
      <div class="flash" id="flash"></div>
      <div class="camtools" id="camtools" hidden>
        <button id="foilBtn" aria-pressed="false">Foil</button>
        <button id="torchBtn" aria-pressed="false" hidden>Light</button>
        <button id="stopBtn">Stop</button>
      </div>
      <div class="camstate" id="camstate" hidden></div>
      <div class="camstart" id="camstart">
        <button class="btn primary" id="startBtn" disabled>Start scanning</button>
        <span class="note" style="color:#B9B4D3">Line the card up in the frame. The number line at the bottom left goes in the gold box.</span>
      </div>
    </div>

    <div class="row" style="justify-content:space-between">
      <h2 class="h2">This session <span class="note" id="logCount"></span></h2>
    </div>
    <div class="list" id="log"></div>

    <div>
      <h2 class="h2" style="margin-bottom:8px">Search</h2>
      <input type="search" id="q" placeholder="Card name, or set + number like 1 207" autocomplete="off" enterkeyhint="search">
      <div class="list" id="qres" hidden style="margin-top:8px"></div>
    </div>
    <div class="row" style="justify-content:space-between">
      <p class="note tiny" id="priceNote" style="margin:0;flex:1;min-width:0"></p>
      <button class="btn tiny" id="refreshBtn">Update prices</button>
    </div>
  </section>

  <!-- COLLECTION -->
  <section class="panel" id="pColl" hidden>
    <input type="search" id="cf" placeholder="Filter your collection" autocomplete="off">
    <div class="row" style="justify-content:space-between">
      <div class="row" style="flex:1;min-width:0">
        <label for="sortSel" class="note">Sort</label>
        <select id="sortSel" style="width:auto">
          <option value="set">Set &amp; number</option>
          <option value="value">Value, high to low</option>
          <option value="name">Name</option>
          <option value="ink">Ink</option>
          <option value="rarity">Rarity</option>
        </select>
      </div>
      <button class="btn primary" id="exportBtn">Export CSV</button>
    </div>
    <div class="list" id="coll"></div>
    <div class="row">
      <label class="btn tiny filebtn">Restore from CSV<input type="file" id="importIn" accept=".csv,text/csv"></label>
      <span class="confirm" id="wipeRow"><button class="btn ghost tiny" id="wipeBtn">Clear collection</button></span>
    </div>
    <p class="note tiny">Your collection lives on this phone. Export a CSV now and then as a backup. Restore from CSV puts an exported file back.</p>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script src="tesseract.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]/g, '');
const money = n => n == null ? '—' : '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const RARITY = ['Common','Uncommon','Rare','Super_rare','Legendary','Epic','Enchanted','Iconic','Promo'];
const rarityLabel = r => (r || '').replace('_', ' ');
const INKS = ['Amber','Amethyst','Emerald','Ruby','Sapphire','Steel'];
const API = 'https://api.lorcast.com/v0';

let DB = null;
let byId, bySetNum, byNV, setIdx, setName;
let inv = {};      // cardId -> {q, f}
let log = [];      // session scans: {key, cardId, foil}
let seq = 0, openEdit = null;

/* ---------- small utils ---------- */
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* ---------- card data ---------- */
function indexCards(d){
  DB = d; byId=new Map(); bySetNum=new Map(); byNV=new Map(); setIdx=new Map(); setName=new Map();
  d.sets.forEach((s,i)=>{ setIdx.set(s.code,i); setName.set(s.code,s.name); });
  for (const c of d.cards){
    byId.set(c.id,c);
    bySetNum.set(norm(c.s)+'|'+norm(c.c), c);
    const k = norm(c.n)+'|'+norm(c.v);
    (byNV.get(k) || byNV.set(k,[]).get(k)).push(c);
  }
}
function priceOf(c, foil){ if(!c) return null; return foil ? (c.pf ?? c.p) : (c.p ?? c.pf); }
function foilOnly(c){ return c && c.p == null && c.pf != null; }
function normalOnly(c){ return c && c.pf == null && c.p != null; }
function inkDot(c){
  const inks = (c.i||'').split('/').filter(Boolean);
  if (inks.length > 1) return `<span class="ink dual" style="--c1:var(--${inks[0].toLowerCase()});--c2:var(--${inks[1].toLowerCase()})"></span>`;
  return `<span class="ink ${esc(inks[0]||'')}"></span>`;
}
function setLabel(c){ return /^\d+$/.test(c.s) ? 'Set '+c.s : c.s; }
function setPriceNote(){
  const d = new Date(DB.asof+'T12:00:00');
  $('priceNote').textContent = `${DB.cards.length.toLocaleString()} cards through ${DB.sets[DB.sets.length-1].name}. TCGplayer prices from ${d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}.`;
}

async function refreshFromLorcast(manual){
  const btn = $('refreshBtn'); btn.disabled = true; const label = btn.textContent;
  try{
    const sr = await fetch(API+'/sets'); if(!sr.ok) throw 0;
    const sets = (await sr.json()).results;
    const cards = [];
    for (let i=0;i<sets.length;i++){
      const s = sets[i]; btn.textContent = `Updating ${i+1}/${sets.length}`;
      const r = await fetch(`${API}/sets/${s.id}/cards`); if(!r.ok) throw 0;
      let list = await r.json(); if (!Array.isArray(list)) list = list.results || [];
      for (const c of list){
        const p = c.prices || {}; const f = x => { const n = parseFloat(x); return isFinite(n) ? n : null; };
        cards.push({id:c.id, n:c.name, v:c.version||'', s:s.code, sn:s.name, c:String(c.collector_number), r:c.rarity||'', i:c.ink || (c.inks||[]).join('/'), t:c.tcgplayer_id||null, p:f(p.usd), pf:f(p.usd_foil)});
      }
      await sleep(120);
    }
    if (cards.length < 1000) throw 0;
    const d = {asof:new Date().toISOString().slice(0,10), sets:sets.map(s=>({code:s.code,name:s.name})), cards};
    indexCards(d); lsSet('inkscan.cards', d); setPriceNote(); renderTotals(); renderLog(); if(!$('pColl').hidden) renderColl();
    if (manual) toast('Prices updated');
  }catch(e){ if (manual) toast('Couldn’t reach Lorcast. Check your connection and try again.'); }
  finally{ btn.textContent = label; btn.disabled = false; }
}

/* ---------- collection storage ---------- */
function save(){ if(!lsSet('inkscan.inv', inv)) toast('Couldn’t save. Your phone may be out of storage.'); renderTotals(); }
function addQty(id, foil, n){
  const v = inv[id] || (inv[id] = {q:0,f:0});
  if (foil) v.f = Math.max(0,(v.f||0)+n); else v.q = Math.max(0,(v.q||0)+n);
  if (!v.q && !v.f) delete inv[id];
  save();
}
function totals(){
  let u=0, copies=0, val=0;
  for (const [id,v] of Object.entries(inv)){ const c=byId.get(id); if(!c) continue; const n=(v.q||0)+(v.f||0); if(!n) continue; u++; copies+=n; val += (v.q||0)*(priceOf(c,false)||0) + (v.f||0)*(priceOf(c,true)||0); }
  return {u,copies,val};
}
function renderTotals(){ const t=totals(); $('tUnique').textContent=t.u.toLocaleString(); $('tCopies').textContent=t.copies.toLocaleString(); $('tValue').textContent='$'+Math.round(t.val).toLocaleString(); }

/* ---------- session log ---------- */
function logAdd(card, foil){
  if (foilOnly(card)) foil = true; if (normalOnly(card)) foil = false;
  addQty(card.id, foil, 1);
  log.unshift({key:++seq, cardId:card.id, foil});
  renderLog();
}
function renderLog(){
  const el=$('log');
  $('logCount').textContent = log.length ? `(${log.length})` : '';
  if (!log.length){ el.innerHTML = `<div class="empty"><strong>No scans yet</strong>Each card you scan goes straight into your collection and shows up here, newest first. Tap Undo if it read the wrong card.</div>`; return; }
  el.innerHTML = log.slice(0,60).map(x=>{
    const c = byId.get(x.cardId); if(!c) return '';
    return `<div class="item"><div class="item-main" style="cursor:default">${inkDot(c)}<div class="who"><div class="n">${esc(c.n)}</div><div class="v">${esc(c.v)}</div><div class="m">${esc(setLabel(c))} · #${esc(c.c)} · ${esc(rarityLabel(c.r))} · ${money(priceOf(c,x.foil))}</div></div>
      <div class="log-act"><button data-lf="${x.key}" aria-pressed="${x.foil}" ${foilOnly(c)||normalOnly(c)?'disabled':''}>Foil</button><button data-lu="${x.key}">Undo</button></div></div></div>`;
  }).join('');
}
$('log').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  const x = log.find(x=>x.key==(b.dataset.lf||b.dataset.lu)); if(!x) return;
  if (b.dataset.lu){ addQty(x.cardId, x.foil, -1); log = log.filter(y=>y!==x); renderLog(); toast('Removed one copy'); }
  else { addQty(x.cardId, x.foil, -1); x.foil = !x.foil; addQty(x.cardId, x.foil, 1); renderLog(); }
});

/* ---------- search ---------- */
function search(q){
  q = q.trim(); if(!q || !DB) return [];
  const out = [];
  const m = q.match(/^#?\s*([A-Za-z]*\d*[A-Za-z]*)\s*[\s\/\-#·]\s*#?(\d+)$/);
  if (m){
    const a = bySetNum.get(norm(m[1])+'|'+norm(m[2])); if (a) out.push(a);
    const b = bySetNum.get(norm(m[2])+'|'+norm(m[1])); if (b && b!==a) out.push(b);
  }
  const nq = norm(q); if (nq.length < 2) return out;
  for (const c of DB.cards){ if (out.length>=30) break; if (!out.includes(c) && (norm(c.n+c.v).includes(nq) || norm(c.n).startsWith(nq))) out.push(c); }
  return out;
}
let qT;
$('q').addEventListener('input', ()=>{ clearTimeout(qT); qT=setTimeout(renderSearch,120); });
function renderSearch(){
  const res = search($('q').value); const el=$('qres');
  el.hidden = !$('q').value.trim();
  el.innerHTML = res.length ? res.map(c=>`<button class="res" data-add="${c.id}">${inkDot(c)}<div class="who"><div class="n">${esc(c.n)}</div><div class="v">${esc(c.v)}</div><div class="m">${esc(setLabel(c))} · #${esc(c.c)} · ${esc(rarityLabel(c.r))} · ${money(priceOf(c,foilOnly(c)))}</div></div><span class="chip">Add</span></button>`).join('') : `<div class="empty" style="padding:16px">No cards match. Try part of the name, or a set and number like <b>5 207</b>.</div>`;
}
$('qres').addEventListener('click', e=>{
  const b=e.target.closest('[data-add]'); if(!b) return;
  const c = byId.get(b.dataset.add); logAdd(c, foilMode); toast(`Added ${c.n}`);
});

/* ---------- reading the number line ---------- */
const DIGITFIX = s => s.replace(/[oOD]/g,'0').replace(/[lI|!]/g,'1').replace(/[sS]/g,'5').replace(/[zZ]/g,'2').replace(/[B]/g,'8');
function parseLine(text){
  const t = text.replace(/\n/g,' ');
  // e.g. "207/204 • EN • 5"  /  "12/P2 • EN"  — OCR often turns the bullets into + - « .
  const re = /([0-9oOlI|sSzZB]{1,3})\s*\/\s*([A-Z0-9]{1,4})\s*[^A-Za-z0-9]{0,4}\s*(EN|FN|EM|ER|FR|DE|IT|JA|ZH|E N)\s*[^A-Za-z0-9]{0,4}\s*([A-Za-z]{0,3}[0-9oOlIsSzZ]{1,2})?/i;
  const m = t.match(re); if (!m) return null;
  const num = String(parseInt(DIGITFIX(m[1]),10));
  let total = m[2].toUpperCase();
  let set = m[4] ? m[4].replace(/^([A-Za-z]*)(.*)$/, (_,a,b)=>a.toUpperCase()+DIGITFIX(b)) : '';
  if (!/^\d+$/.test(DIGITFIX(total))) { if(!set) set = total; } // promo style "12/P2"
  const tries = [];
  if (set) tries.push(set);
  if (!/^\d+$/.test(total)) tries.push(total);
  for (const s of tries){ const c = bySetNum.get(norm(s)+'|'+norm(num)); if (c) return c; }
  return null;
}

/* ---------- camera + OCR loop ---------- */
let stream=null, worker=null, workerReady=null, scanning=false, busy=false;
let foilMode=false, lastKey=null, streak=0, cooldownKey=null, blankFrames=0, lastHitAt=0;
const video=$('video'), cv=document.createElement('canvas'), ctx=cv.getContext('2d',{willReadFrequently:true});

function abs(p){ return new URL(p, location.href).href; }
function getWorker(){
  if (!workerReady){
    workerReady = Tesseract.createWorker('eng', 1, {
      workerPath: abs('worker.min.js'), corePath: abs('./'), langPath: abs('./'),
      workerBlobURL: false, gzip: true, cacheMethod: 'write'
    }).then(async w=>{ await w.setParameters({tessedit_pageseg_mode:'6'}); worker=w; return w; });
  }
  return workerReady;
}
function camMsg(s){ const el=$('camstate'); el.textContent=s; el.hidden=!s; }

async function startCam(){
  $('startBtn').disabled = true; $('startBtn').textContent = 'Starting…';
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:'environment'}, width:{ideal:1920}}});
  }catch(e){
    $('startBtn').disabled=false; $('startBtn').textContent='Start scanning';
    toast(e && e.name==='NotAllowedError' ? 'Camera access is blocked. Allow it in your browser’s site settings, then try again.' : 'Couldn’t open the camera.');
    return;
  }
  video.srcObject = stream; await video.play().catch(()=>{});
  const track = stream.getVideoTracks()[0];
  try{ const caps = track.getCapabilities?.() || {}; $('torchBtn').hidden = !caps.torch;
       if (caps.focusMode && caps.focusMode.includes('continuous')) track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{}); }catch(e){}
  $('camstart').hidden = true; $('guide').hidden = false; $('camtools').hidden = false;
  camMsg('Loading the reader…');
  try{ await getWorker(); }catch(e){ camMsg('The card reader didn’t load. Reload the page and try again.'); return; }
  scanning = true; camMsg('Line the number line up in the gold box');
  try{ await navigator.wakeLock?.request('screen'); }catch(e){}
  loop();
}
function stopCam(){
  scanning=false; if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  video.srcObject=null; $('camstart').hidden=false; $('guide').hidden=true; $('camtools').hidden=true; camMsg('');
  $('startBtn').disabled=false; $('startBtn').textContent='Start scanning';
  $('torchBtn').setAttribute('aria-pressed','false');
}
function stripRectInVideo(){
  const box = $('cam').getBoundingClientRect(), strip = $('guide').firstElementChild.getBoundingClientRect();
  const vw=video.videoWidth, vh=video.videoHeight; if(!vw||!vh) return null;
  const sc = Math.max(box.width/vw, box.height/vh);
  const ox = (vw*sc - box.width)/2, oy = (vh*sc - box.height)/2;
  // pad the box a little so a slightly off card still lands inside
  const padX = strip.width*0.06, padY = strip.height*0.35;
  let x=(strip.left-box.left-padX+ox)/sc, y=(strip.top-box.top-padY+oy)/sc, w=(strip.width+2*padX)/sc, h=(strip.height+2*padY)/sc;
  x=Math.max(0,x); y=Math.max(0,y); w=Math.min(vw-x,w); h=Math.min(vh-y,h);
  return {x,y,w,h};
}
function grabStrip(){
  const r = stripRectInVideo(); if(!r) return null;
  const target = 1300; const s = target / r.w;
  cv.width = Math.round(r.w*s); cv.height = Math.round(r.h*s);
  ctx.filter = 'grayscale(1)';
  ctx.drawImage(video, r.x, r.y, r.w, r.h, 0, 0, cv.width, cv.height);
  ctx.filter = 'none';
  // stretch contrast
  const img = ctx.getImageData(0,0,cv.width,cv.height), d=img.data; let lo=255, hi=0;
  for (let i=0;i<d.length;i+=16){ const v=d[i]; if(v<lo) lo=v; if(v>hi) hi=v; }
  const k = hi>lo ? 255/(hi-lo) : 1;
  for (let i=0;i<d.length;i+=4){ const v=(d[i]-lo)*k; d[i]=d[i+1]=d[i+2]=v; }
  ctx.putImageData(img,0,0);
  return cv;
}
async function loop(){
  while (scanning){
    if (document.hidden || !worker){ await sleep(400); continue; }
    const frame = grabStrip(); if(!frame){ await sleep(200); continue; }
    let card = null;
    try{ const {data} = await worker.recognize(frame); card = parseLine(data.text); }catch(e){}
    if (!scanning) break;
    if (!card){
      streak=0; lastKey=null; blankFrames++;
      if (blankFrames>=2) cooldownKey=null;          // card moved away: allow the same card again
      if (Date.now()-lastHitAt > 2500) camMsg('Line the number line up in the gold box');
    } else {
      blankFrames=0;
      streak = (card.id===lastKey) ? streak+1 : 1; lastKey = card.id;
      if (streak>=2 && card.id!==cooldownKey){ hit(card); cooldownKey = card.id; }
      else if (card.id===cooldownKey && Date.now()-lastHitAt > 1800) camMsg('Got it. Swap in the next card.');
    }
    await sleep(120);
  }
}
function beep(){
  try{
    const ac = beep.ac || (beep.ac = new (window.AudioContext||window.webkitAudioContext)());
    const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=1320; g.gain.value=0.08;
    o.connect(g); g.connect(ac.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+0.12); o.stop(ac.currentTime+0.13);
  }catch(e){}
}
function hit(card){
  lastHitAt = Date.now();
  logAdd(card, foilMode);
  const f=$('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  $('guide').classList.add('hit'); setTimeout(()=>$('guide').classList.remove('hit'),500);
  navigator.vibrate?.(60); beep();
  const x = log[0];
  camMsg(`${card.n} · ${card.v ? card.v+' · ' : ''}${money(priceOf(card,x.foil))}${x.foil?' foil':''}`);
}
$('startBtn').onclick = startCam;
$('stopBtn').onclick = stopCam;
$('foilBtn').onclick = ()=>{ foilMode=!foilMode; $('foilBtn').setAttribute('aria-pressed',foilMode); toast(foilMode?'Foil mode on: scans count as foil':'Foil mode off'); };
$('torchBtn').onclick = async ()=>{
  const t = stream?.getVideoTracks()[0]; if(!t) return; const on = $('torchBtn').getAttribute('aria-pressed')!=='true';
  try{ await t.applyConstraints({advanced:[{torch:on}]}); $('torchBtn').setAttribute('aria-pressed',on); }catch(e){ toast('This camera’s light can’t be controlled here.'); }
};
document.addEventListener('visibilitychange', ()=>{ if (document.hidden && stream) stopCam(); });

/* ---------- collection view ---------- */
function collRows(){
  const f = norm($('cf').value); const rows = [];
  for (const [id,v] of Object.entries(inv)){
    const c = byId.get(id); if(!c || !((v.q||0)+(v.f||0))) continue;
    if (f && !norm(c.n+c.v+c.sn+c.i+c.r).includes(f) && !(norm(setLabel(c))+norm(c.c)).includes(f)) continue;
    rows.push({c, q:v.q||0, f:v.f||0, val:(v.q||0)*(priceOf(c,false)||0)+(v.f||0)*(priceOf(c,true)||0)});
  }
  const bySet = (a,b)=>(setIdx.get(a.c.s)-setIdx.get(b.c.s))||(parseInt(a.c.c)-parseInt(b.c.c))||a.c.c.localeCompare(b.c.c);
  const s = $('sortSel').value;
  rows.sort(s==='value'?(a,b)=>b.val-a.val||bySet(a,b):s==='name'?(a,b)=>a.c.n.localeCompare(b.c.n)||a.c.v.localeCompare(b.c.v)||bySet(a,b):s==='ink'?(a,b)=>INKS.indexOf(a.c.i.split('/')[0])-INKS.indexOf(b.c.i.split('/')[0])||bySet(a,b):s==='rarity'?(a,b)=>RARITY.indexOf(b.c.r)-RARITY.indexOf(a.c.r)||bySet(a,b):bySet);
  return rows;
}
function groupKey(r){ const s=$('sortSel').value; return s==='set'?r.c.s : s==='ink'?(r.c.i||'Other') : s==='rarity'?r.c.r : null; }
function groupLabel(k){ const s=$('sortSel').value; return s==='set'? (/^\d+$/.test(k)?`Set ${k} · ${setName.get(k)}`:setName.get(k)||k) : s==='rarity'? rarityLabel(k) : k; }
function renderColl(){
  const el = $('coll'); const rows = collRows();
  if (!rows.length){
    el.innerHTML = Object.keys(inv).length ? `<div class="empty"><strong>No matches</strong>Nothing in your collection matches that filter.</div>` : `<div class="empty"><strong>Your collection is empty</strong>Scan cards on the Scan tab, or find them with Search.</div>`;
    return;
  }
  const groups = new Map();
  for (const r of rows){ const k=groupKey(r); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(r); }
  let html='';
  for (const [k,rs] of groups){
    if (k!==null){ const cnt=rs.reduce((a,r)=>a+r.q+r.f,0), val=rs.reduce((a,r)=>a+r.val,0); html+=`<div class="group">${esc(groupLabel(k))}<span>${cnt} · ${money(val)}</span></div>`; }
    for (const r of rs){
      const c=r.c, open=openEdit===c.id;
      html += `<div class="item"><button class="item-main" data-open="${c.id}" aria-expanded="${open}">${inkDot(c)}<div class="who"><div class="n">${esc(c.n)}</div><div class="v">${esc(c.v)}</div><div class="m">${esc(setLabel(c))} · #${esc(c.c)} · ${esc(rarityLabel(c.r))}</div></div><div class="qtyv"><div class="q">${r.q?`×${r.q}`:''}${r.q&&r.f?' ':''}${r.f?`<span class="chip foil">Foil ×${r.f}</span>`:''}</div><div class="p">${money(r.val)}</div></div></button>
      ${open?`<div class="edit">
        <div class="step"><label>Normal</label><button data-q="${c.id}" data-f="0" data-d="-1" aria-label="One fewer normal">−</button><output>${r.q}</output><button data-q="${c.id}" data-f="0" data-d="1" aria-label="One more normal" ${foilOnly(c)?'disabled':''}>+</button><span class="note tiny">${money(priceOf(c,false))} each</span></div>
        <div class="step"><label>Foil</label><button data-q="${c.id}" data-f="1" data-d="-1" aria-label="One fewer foil">−</button><output>${r.f}</output><button data-q="${c.id}" data-f="1" data-d="1" aria-label="One more foil" ${normalOnly(c)?'disabled':''}>+</button><span class="note tiny">${money(priceOf(c,true))} each</span></div>
        ${c.t?`<a href="https://www.tcgplayer.com/product/${c.t}" target="_blank" rel="noopener">View on TCGplayer ↗</a>`:''}
      </div>`:''}</div>`;
    }
  }
  el.innerHTML = html;
}
$('coll').addEventListener('click', e=>{
  const q = e.target.closest('button[data-q]');
  if (q){ addQty(q.dataset.q, q.dataset.f==='1', +q.dataset.d); if(!inv[q.dataset.q]) openEdit=null; renderColl(); return; }
  const o = e.target.closest('[data-open]'); if (o){ openEdit = openEdit===o.dataset.open ? null : o.dataset.open; renderColl(); }
});
let cfT; $('cf').addEventListener('input',()=>{ clearTimeout(cfT); cfT=setTimeout(renderColl,120); });
$('sortSel').onchange = renderColl;

$('wipeRow').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  if (b.id==='wipeBtn') $('wipeRow').innerHTML = `<span>Remove every card?</span><button class="btn tiny" id="wipeYes" style="color:var(--bad)">Remove all</button><button class="btn ghost tiny" id="wipeNo">Keep</button>`;
  else if (b.id==='wipeYes'){ inv={}; log=[]; save(); renderLog(); renderColl(); resetWipe(); toast('Collection cleared'); }
  else if (b.id==='wipeNo') resetWipe();
});
function resetWipe(){ $('wipeRow').innerHTML = `<button class="btn ghost tiny" id="wipeBtn">Clear collection</button>`; }

/* ---------- CSV export / restore ---------- */
const HEAD = ['Name','Version','Set Code','Set Name','Card Number','Rarity','Ink','Finish','Quantity','Market Price','Total Value','TCGplayer Product ID','TCGplayer URL','Lorcast ID'];
function csvCell(v){ v = v==null?'':String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function buildCsv(){
  const rows=[HEAD];
  const sorted = Object.entries(inv).map(([id,v])=>({c:byId.get(id),v})).filter(x=>x.c).sort((a,b)=>(setIdx.get(a.c.s)-setIdx.get(b.c.s))||(parseInt(a.c.c)-parseInt(b.c.c)));
  for (const {c,v} of sorted) for (const [foil,n] of [[false,v.q||0],[true,v.f||0]]){
    if (!n) continue; const p = priceOf(c,foil);
    rows.push([c.n,c.v,c.s,c.sn,c.c,rarityLabel(c.r),c.i,foil?'Foil':'Normal',n,p==null?'':p.toFixed(2),p==null?'':(p*n).toFixed(2),c.t||'',c.t?`https://www.tcgplayer.com/product/${c.t}`:'',c.id]);
  }
  return rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
}
$('exportBtn').onclick = ()=>{
  if (!Object.keys(inv).length){ toast('Nothing to export yet'); return; }
  const blob = new Blob(['﻿'+buildCsv()], {type:'text/csv'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`lorcana-collection-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('CSV downloaded');
};
function parseCsv(text){
  const rows=[]; let row=[], cell='', q=false;
  for (let i=0;i<text.length;i++){
    const ch=text[i];
    if (q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if (ch==='"') q=true; else if (ch===','){ row.push(cell); cell=''; }
    else if (ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; } else if (ch!=='\r') cell+=ch;
  }
  if (cell||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
$('importIn').onchange = async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const rows = parseCsv((await f.text()).replace(/^﻿/,'')); const h = rows.shift()||[];
  const ix = n => h.indexOf(n);
  const iId=ix('Lorcast ID'), iSet=ix('Set Code'), iNum=ix('Card Number'), iFin=ix('Finish'), iQty=ix('Quantity');
  if (iQty<0 || (iId<0 && (iSet<0||iNum<0))){ toast('That file isn’t an InkScan export.'); return; }
  let n=0, miss=0; const next={};
  for (const r of rows){
    const c = (iId>=0 && byId.get(r[iId])) || bySetNum.get(norm(r[iSet])+'|'+norm(r[iNum]));
    const qty = parseInt(r[iQty],10); if(!c || !(qty>0)){ if(r.length>1) miss++; continue; }
    const v = next[c.id] || (next[c.id]={q:0,f:0}); if ((r[iFin]||'').toLowerCase()==='foil') v.f+=qty; else v.q+=qty; n+=qty;
  }
  inv = next; save(); renderColl(); toast(`Restored ${n} cards${miss?`, ${miss} rows skipped`:''}`);
};

/* ---------- tabs ---------- */
function showTab(t){
  const scan = t==='scan';
  $('tabScan').setAttribute('aria-selected',scan); $('tabColl').setAttribute('aria-selected',!scan);
  $('pScan').hidden=!scan; $('pColl').hidden=scan;
  if (!scan){ if (stream) stopCam(); renderColl(); }
}
$('tabScan').onclick=()=>showTab('scan'); $('tabColl').onclick=()=>showTab('coll');
$('refreshBtn').onclick=()=>refreshFromLorcast(true);

/* ---------- boot ---------- */
async function boot(){
  renderLog();
  let d = lsGet('inkscan.cards', null);
  if (!d){
    try{ const r = await fetch('cards.json'); d = await r.json(); }
    catch(e){ $('loadBanner').textContent='The card list didn’t load. Check your connection and reload.'; $('loadBanner').classList.add('bad'); return; }
  }
  indexCards(d); $('loadBanner').hidden = true; setPriceNote();
  inv = lsGet('inkscan.inv', {}) || {}; for (const id of Object.keys(inv)) if(!byId.has(id)) delete inv[id];
  renderTotals();
  $('startBtn').disabled = !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  if ($('startBtn').disabled) $('camstart').querySelector('.note').textContent = 'This browser can’t open the camera. Use Chrome, or add cards with Search.';
  navigator.storage?.persist?.().catch(()=>{});
  const age = (Date.now() - new Date(DB.asof+'T00:00:00').getTime())/86400000;
  if (age > 3 && navigator.onLine) refreshFromLorcast(false);
  getWorker().catch(()=>{});   // warm the reader so the first scan is quick
}
boot();
if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__inkscan = {parseLine:(t)=>parseLine(t), get worker(){return worker}, get log(){return log}};
})();
</script>
